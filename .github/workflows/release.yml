name: Build and release .deb

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and test
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Select package version
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base_version="$(node -p "require('./package.json').version")"
            short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            version="${base_version}+git${GITHUB_RUN_NUMBER}.${short_sha}"
          fi
          printf 'version=%s\n' "$version" | tee -a "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh "${{ steps.package-version.outputs.version }}"

      - name: Verify package and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.package-version.outputs.version }}"
          package="dist/zplexpress_${version}_all.deb"
          test -f "$package"
          test "$(dpkg-deb --field "$package" Package)" = "zplexpress"
          test "$(dpkg-deb --field "$package" Version)" = "$version"
          test "$(dpkg-deb --field "$package" Architecture)" = "all"
          test "$(dpkg-deb --field "$package" Depends)" = \
            "nodejs (>= 18.0.0), cups, cups-client, xdg-utils"
          test "$(dpkg-deb --field "$package" Suggests)" = \
            "ocom-ocbp-t4201-driver (>= 1.0.3)"
          (
            cd dist
            sha256sum ./*.deb > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zplexpress-deb-${{ github.run_number }}
          path: |
            dist/*.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.package-version.outputs.version }}"
          package="dist/zplexpress_${version}_all.deb"
          notes_file="$RUNNER_TEMP/zplexpress-release-notes.md"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="ZPLExpress ${version}"
            release_options=(--latest)
          else
            release_tag="build-${GITHUB_RUN_NUMBER}"
            release_title="ZPLExpress automatic build ${version}"
            release_options=(--prerelease --latest=false --target "$GITHUB_SHA")
          fi

          {
            printf 'Automated Debian package for commit %s.\n\n' "$GITHUB_SHA"
            printf 'For OCOM, install its driver first. ARGOX/ZEBRA use a raw CUPS queue.\n\n'
            printf 'Install ZPLExpress with:\n\n'
            printf '~~~bash\n'
            printf 'sudo apt install ./%s\n' "$(basename "$package")"
            printf '~~~\n'
          } > "$notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              "$package" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$release_tag" \
              "$package" dist/SHA256SUMS.txt \
              --title "$release_title" \
              --notes-file "$notes_file" \
              "${release_options[@]}"
          fi
